<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2a6f"><title>Online Election Portal</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mut:#5b6679;--pr:#0b2a6f;--gold:#c9a227;--bd:#dde3ef;--ok:#1b7f4b;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0f1424;--card:#192038;--tx:#eef1fa;--mut:#9aa6bf;--pr:#7da0ff;--bd:#2b3556}}
*{box-sizing:border-box}body{margin:0;font:17px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:12px 16px;background:#0b2a6f;color:#fff}nav b{margin-right:auto;font-size:18px}
nav button{background:transparent;color:#fff;border:1px solid #ffffff55;padding:8px 14px}nav button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.hero{background:linear-gradient(135deg,#0b2a6f,#1f4fd8);color:#fff;text-align:center;padding:44px 16px}.hero h1{margin:0 0 6px;font-size:clamp(28px,6vw,44px)}.hero p{opacity:.9;margin:0 0 20px}
main{max-width:900px;margin:18px auto;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;animation:in .4s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
button{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:13px 18px;font-size:17px;cursor:pointer;min-height:48px}button.g{background:var(--gold);color:#111;font-weight:600}button.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.s{padding:6px 10px;min-height:0;font-size:14px}
input,textarea,select{width:100%;padding:12px;margin:4px 0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input#otp{font-size:28px;letter-spacing:10px;text-align:center}:focus-visible{outline:3px solid var(--gold)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;background:#e6ecff;color:#0b2a6f}.pill.OPEN{background:#d9f5e5;color:var(--ok)}.pill.RESULTS{background:#fff1c2;color:#7a5b00}.pill.CLOSED,.pill.LOCKED{background:#fde2df;color:var(--bad)}
.cd{font-size:20px;font-weight:700;color:var(--pr);margin:6px 0}.mut{color:var(--mut);font-size:14px}.hide{display:none!important}
.cand{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--bd);border-radius:12px;margin:8px 0;cursor:pointer}.cand:has(input:checked){border-color:var(--gold);background:#c9a22718}.cand input{width:22px;height:22px;margin:0}
.av{width:52px;height:52px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.bar{height:12px;border-radius:6px;background:var(--gold);margin:4px 0 10px}.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:9}.md{background:var(--card);border-radius:14px;padding:20px;max-width:420px;width:100%}.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sc{overflow-x:auto}.big{font-size:28px;font-weight:700}
</style></head><body>
<nav><b>🗳️ Online Election Portal</b><button data-v="home" class="on">Home</button><button data-v="vote">Vote Now</button><button data-v="res">Results</button><button data-v="adm">Commissioner</button></nav>
<section id="home"><div class="hero"><h1>Online Election Portal</h1><p>Secure voting for registered members: Mobile → OTP → Select → Confirm</p><button class="g" onclick="show('vote')">Member Login / Vote Now</button> <button class="o" style="color:#fff;border-color:#fff8" onclick="show('res')">Election Results</button></div>
<main><h2>Election Information</h2><div class="grid" id="cards"></div></main></section>
<main><section id="vote" class="hide">
 <div class="card" id="login"><h2>Member verification</h2><label for="mob">Your registered mobile number</label><input id="mob" inputmode="numeric" autocomplete="tel" placeholder="10-digit mobile number"><button onclick="reqOtp()">Send OTP</button>
  <div id="otpbox" class="hide"><br><label for="otp">Enter the 6-digit OTP</label><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="g" onclick="verify()">Verify &amp; Continue</button></div></div>
 <div id="ballot"></div></section>
<section id="res" class="hide"><div id="rlist"></div></section>
<section id="adm" class="hide">
 <div class="card" id="alogin"><h2>Commissioner login</h2><label for="apw">Password</label><input id="apw" type="password" autocomplete="current-password"><button onclick="alogin()">Login</button></div>
 <div id="apanel" class="hide"><div class="tabs"><button class="o s" onclick="tab('dash')">Dashboard</button><button class="o s" onclick="tab('mem')">Members</button><button class="o s" onclick="tab('ele')">Elections</button><button class="o s" onclick="tab('not')">Notices</button><button class="o s" onclick="tab('aud')">Audit</button></div><div id="atab"></div></div></section></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S='',T='',E=[];const LBL={UPCOMING:'UPCOMING',OPEN:'VOTING OPEN',CLOSED:'VOTING CLOSED',RESULTS:'RESULTS PUBLISHED',LOCKED:'ELECTION LOCKED'},fmt=d=>new Date(d).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
async function api(p,body,h={},raw){const r=await fetch(p,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...h},body:body?JSON.stringify(body):undefined});if(raw&&r.ok)return r.text();const d=await r.json();if(!r.ok)throw Object.assign(new Error(d.error||'Something went wrong'),{status:r.status});return d}
function modal(title,html,btns=[['OK','g']]){return new Promise(r=>{const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="md" role="dialog" aria-modal="true"><h3>${title}</h3><div>${html}</div><div class="row">${btns.map((b,i)=>`<button class="${b[1]||''}" data-i="${i}">${b[0]}</button>`).join('')}</div></div>`;d.onclick=e=>{if(e.target.dataset.i!==undefined){d.remove();r(+e.target.dataset.i)}};document.body.append(d);d.querySelector('button:last-child').focus()})}
const go=f=>async(...a)=>{try{await f(...a)}catch(e){modal('Notice',esc(e.message))}};
function show(v){document.querySelectorAll('main>section,body>section').forEach(s=>s.classList.add('hide'));$('#'+v).classList.remove('hide');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));if(v=='home')home();if(v=='res')results()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
function cd(e){const n=Date.now(),t=e.status=='UPCOMING'?Date.parse(e.start_at):Date.parse(e.end_at);if(!['UPCOMING','OPEN'].includes(e.status))return LBL[e.status];let s=Math.max(0,Math.floor((t-n)/1000));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(e.status=='UPCOMING'?'Voting opens in ':'Voting closes in ')+`${d}d ${h}h ${m}m ${s%60}s`}
setInterval(()=>document.querySelectorAll('[data-cd]').forEach(el=>{const e=E.find(x=>x.id==el.dataset.cd);if(e)el.textContent=cd(e)}),1000);
const home=go(async()=>{E=(await api('/api/public')).elections;$('#cards').innerHTML=E.map(e=>`<div class="card"><span class="pill ${e.status}">${LBL[e.status]}</span><h3>${esc(e.post)}</h3><div class="mut">${esc(e.name)} · ${esc(e.code)}</div><p>${fmt(e.start_at)}<br>to ${fmt(e.end_at)}</p><div class="cd" data-cd="${e.id}"></div>
 ${e.status!='UPCOMING'?`<p>Registered voters: <b>${e.eligible}</b><br>Votes polled: <b>${e.polled}</b> · Turnout: <b>${e.turnout}%</b></p><div class="bar" style="width:${Math.min(100,e.turnout)}%"></div>`:''}
 ${(e.live||[]).map(c=>`<div>${esc(c.name)}: <b>${c.votes}</b></div>`).join('')}</div>`).join('')||'<p>No elections have been scheduled yet.</p>'});
window.reqOtp=go(async()=>{await api('/api/otp/request',{mobile:$('#mob').value});$('#otpbox').classList.remove('hide');$('#otp').focus();await modal('OTP sent','An OTP has been sent to your registered mobile number.')});
window.verify=go(async()=>{const d=await api('/api/otp/verify',{mobile:$('#mob').value,otp:$('#otp').value});S=d.session;$('#login').classList.add('hide');ballot(d.name)});
const ballot=go(async name=>{const d=await api('/api/ballot',null,{'x-session':S});$('#ballot').innerHTML=(name?`<p>Welcome, <b>${esc(name)}</b></p>`:'')+(d.elections.map(e=>`<div class="card" style="margin-bottom:14px"><h2>${esc(e.post)}</h2><div class="mut">${esc(e.name)} · Election ID: ${esc(e.code)}</div>`+(e.voted?'<p>✅ You have already voted in this election.</p>':e.candidates.map(c=>`<label class="cand"><span class="av">${esc(c.name[0])}</span><span style="flex:1"><b>${esc(c.name)}</b><br><span class="mut">${esc(c.code)} · ${esc(c.description)}</span></span><input type="radio" name="e${e.id}" value="${c.id}" data-n="${esc(c.name)}"></label>`).join('')+`<button class="g" style="width:100%" onclick="cast(${e.id})">CAST MY VOTE</button>`)+'</div>').join('')||'<div class="card">No election is open right now.</div>')});
window.cast=go(async id=>{const c=document.querySelector(`input[name=e${id}]:checked`);if(!c)return modal('Select a candidate','Please select one candidate first.');
 if(await modal('Confirm your vote',`Are you sure you want to cast your vote for <b>${c.dataset.n}</b>?<br><span class="mut">This cannot be changed.</span>`,[['CANCEL','o'],['CONFIRM VOTE','g']])!=1)return;
 try{const d=await api('/api/vote',{election_id:id,candidate_id:+c.value},{'x-session':S});await modal('✅ Vote recorded',`Your vote has been successfully recorded.<br><span class="mut">Transaction ID: ${esc(d.txn)}</span>`)}catch(e){await modal(e.status==409?'Vote Already Recorded':'Notice',esc(e.message))}ballot()});
const results=go(async()=>{E=(await api('/api/public')).elections;let h='';for(const e of E){h+=`<div class="card" style="margin-bottom:14px"><span class="pill ${e.status}">${LBL[e.status]}</span><h2>${esc(e.post)}</h2><div class="mut">${esc(e.name)} · ${esc(e.code)}</div><p>Eligible: <b>${e.eligible}</b> · Polled: <b>${e.polled}</b> · Turnout: <b>${e.turnout}%</b></p>`;
 if(e.status=='RESULTS'){const r=await api('/api/results/'+e.id);h+=r.results.map((x,i)=>`<div>${i==0&&x.votes?'🏆 ':''}<b>${esc(x.name)}</b> — ${x.votes} votes (${x.pct}%)</div><div class="bar" style="width:${x.pct}%"></div>`).join('')+'<button class="o s" onclick="print()">Print</button>'}else h+='<p class="mut">Results will be shown after publication.</p>';h+='</div>'}$('#rlist').innerHTML=h||'<div class="card">No elections yet.</div>'});
// ---------- Admin ----------
const A=()=>({'x-token':T});
window.alogin=go(async()=>{T=(await api('/api/admin/login',{password:$('#apw').value})).token;$('#alogin').classList.add('hide');$('#apanel').classList.remove('hide');tab('dash')});
window.tab=go(async t=>{const el=$('#atab');
 if(t=='dash'){const d=await api('/api/admin/dashboard',null,A());el.innerHTML=`<div class="grid">${[['Total Members',d.members],['Eligible',d.eligible],['Candidates',d.candidates],['Active Elections',d.active],['Votes Polled',d.votes],['Completed',d.completed]].map(x=>`<div class="card"><div class="mut">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('')}</div><h3>Post-wise turnout</h3>`+d.elections.map(e=>`<div class="card" style="margin-bottom:10px"><b>${esc(e.post)}</b> <span class="mut">${esc(e.code)} · ${LBL[e.status]}</span><div>${e.polled} of ${e.eligible} (${e.turnout}%)</div><div class="bar" style="width:${Math.min(100,e.turnout)}%"></div></div>`).join('')}
 if(t=='mem'){const d=await api('/api/admin/members?q='+encodeURIComponent(window.mq||''),null,A());el.innerHTML=`<div class="card"><h3>Upload member list</h3><button class="o s" onclick="sample()">Download sample template</button><p class="mut">CSV columns: member_id, name, mobile, email, category, eligible</p><input type="file" id="mf" accept=".csv"><button onclick="upM(true)">Validate file</button><div id="mv"></div></div>
 <div class="card" style="margin-top:12px"><h3>Add a member</h3><input id="nid" placeholder="Member ID"><input id="nname" placeholder="Name"><input id="nmob" placeholder="Mobile (10 digits)" inputmode="numeric"><input id="nem" placeholder="Email (optional)"><input id="ncat" placeholder="Category (optional)"><button class="g" onclick="addM()">Add member</button></div>
 <div class="card" style="margin-top:12px"><h3>Search members</h3><input id="mq" placeholder="ID, name, mobile or email" value="${esc(window.mq||'')}" onchange="mq=this.value;tab('mem')"><div class="sc"><table><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Eligible</th><th>Actions</th></tr>${d.rows.map(m=>`<tr><td>${esc(m.member_id)}</td><td>${esc(m.name)}</td><td>${m.mobile}</td><td>${m.eligible?'Yes':'No'}</td><td style="white-space:nowrap"><button class="o s" onclick="elM('${esc(m.member_id)}',${m.eligible?0:1})">${m.eligible?'Make ineligible':'Make eligible'}</button> <button class="o s" style="color:#b00020" onclick="rmM('${esc(m.member_id)}','${esc(m.name)}')">Remove</button></td></tr>`).join('')}</table></div><p class="mut">Upload history: ${d.uploads.map(u=>`${fmt(u.at)} (${u.imported} ok, ${u.rejected} rejected)`).join(' · ')||'none'}</p></div>`}
 if(t=='ele'){const d=await api('/api/admin/dashboard',null,A());el.innerHTML=`<div class="card"><h3>Create election (one post = one Election ID)</h3><input id="en" placeholder="Election name, e.g. Annual Association Election 2026"><input id="ep" placeholder="Post, e.g. President"><label class="mut">Voting starts<input id="es" type="datetime-local"></label><label class="mut">Voting ends<input id="ee" type="datetime-local"></label><label class="mut">Result publication (optional)<input id="er" type="datetime-local"></label><textarea id="ec" rows="4" placeholder="Candidates, one per line:  Name | short description"></textarea><button class="g" onclick="mk()">Review &amp; Publish</button></div>`+d.elections.map(e=>`<div class="card" style="margin-top:12px"><b>${esc(e.post)}</b> <span class="pill ${e.status}">${LBL[e.status]}</span><div class="mut">${esc(e.code)} · ${e.candidates.length} candidates</div><div class="row" style="justify-content:flex-start"><button class="o s" onclick="st(${e.id},{live_candidates:${e.live_candidates?0:1}})">Live candidate count: ${e.live_candidates?'ON':'OFF'}</button><button class="o s" onclick="st(${e.id},{locked:${e.locked?0:1}})">${e.locked?'Unlock':'Emergency lock'}</button><button class="o s" onclick="ext(${e.id})">Extend end time</button><button class="o s" onclick="rep(${e.id},'${esc(e.code)}')">Report (CSV)</button></div></div>`).join('')}
 if(t=='not'){const d=await api('/api/admin/notices',null,A());el.innerHTML=`<div class="card"><h3>Send notice (SMS + email) to all eligible members</h3><textarea id="nm" rows="4" placeholder="Dear Member, the election will be held on [DATE] from [START] to [END]. Please vote using your registered mobile number and OTP. – Election Commissioner"></textarea><label class="mut">Send at (empty = now)<input id="ns" type="datetime-local"></label><button class="g" onclick="nt()">Schedule</button></div><div class="card" style="margin-top:12px"><h3>Delivery status</h3>${d.map(n=>`<p>${fmt(n.send_at)} — ${n.sent?`sent ${n.ok}, failed ${n.failed}`:'scheduled'}<br><span class="mut">${esc(n.message.slice(0,90))}</span></p>`).join('')||'None yet'}</div>`}
 if(t=='aud')el.innerHTML=`<div class="card"><h3>⚠️ Restricted audit mode</h3><p class="mut">Exceptional action. Requires the audit key and a written reason, and is permanently logged. It shows who voted and the activity log. Individual ballots cannot be linked to voters.</p><input id="ai" placeholder="Election number (internal ID, e.g. 1)"><input id="ak" type="password" placeholder="Audit key"><textarea id="ar" rows="2" placeholder="Reason for access"></textarea><button onclick="aud()">Open audit view</button><div class="sc" id="ao"></div></div>`});
window.addM=go(async()=>{await api('/api/admin/members/add',{member_id:$('#nid').value,name:$('#nname').value,mobile:$('#nmob').value,email:$('#nem').value,category:$('#ncat').value},A());await modal('Added','Member added.');tab('mem')});
window.rmM=go(async(id,n)=>{if(!confirm('Remove member '+id+(n?' ('+n+')':'')+'? This cannot be undone.'))return;await api('/api/admin/members/remove',{member_id:id},A());tab('mem')});
window.elM=go(async(id,v)=>{await api('/api/admin/members/eligible',{member_id:id,eligible:v},A());tab('mem')});
window.sample=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['member_id,name,mobile,email,category,eligible\nM001,Ramesh Kumar,9876543210,ramesh@example.com,General,yes\n'],{type:'text/csv'}));a.download='members_template.csv';a.click()};
let rows=[];window.upM=go(async dry=>{if(dry){const f=$('#mf').files[0];if(!f)return modal('File needed','Please choose a CSV file.');const L=(await f.text()).split(/\r?\n/).filter(Boolean),h=L[0].toLowerCase().split(',').map(s=>s.trim());rows=L.slice(1).map(l=>{const c=l.split(',').map(s=>s.trim().replace(/^"|"$/g,''));return Object.fromEntries(h.map((k,i)=>[k,c[i]]))});window.fn=f.name}
 const d=await api('/api/admin/members',{rows,dry,filename:window.fn},A());$('#mv').innerHTML=d.imported?`<p>✅ Imported ${d.valid} members.</p>`:`<p>✅ ${d.valid} valid · ❌ ${d.errors.length} rejected</p>${d.errors.slice(0,50).map(e=>`<div class="mut">Row ${e.row} ${esc(e.member_id)}: ${esc(e.msg)}</div>`).join('')}<button class="g" onclick="upM(false)">Import ${d.valid} valid rows</button> <span class="mut">or fix the file and re-upload.</span>`});
window.mk=go(async()=>{const c=$('#ec').value.split('\n').map(s=>s.trim()).filter(Boolean).map(l=>{const[n,d]=l.split('|');return{name:n.trim(),description:(d||'').trim()}}),b={name:$('#en').value,post:$('#ep').value,start_at:new Date($('#es').value).toISOString(),end_at:new Date($('#ee').value).toISOString(),result_at:$('#er').value?new Date($('#er').value).toISOString():null,candidates:c};
 if(await modal('Final confirmation',`Publish <b>${esc(b.post)}</b> with ${c.length} candidates?<br>${fmt(b.start_at)} → ${fmt(b.end_at)}`,[['Back','o'],['Publish','g']])!=1)return;const d=await api('/api/admin/elections',b,A());await modal('Election created',`Election ID: <b>${esc(d.election_id)}</b>`);tab('ele')});
window.st=go(async(id,b)=>{await api(`/api/admin/elections/${id}/settings`,b,A());tab('ele')});
window.ext=go(async id=>{const v=prompt('New end date/time (YYYY-MM-DD HH:MM)');if(v)await st(id,{end_at:new Date(v.replace(' ','T')).toISOString()})});
window.rep=go(async(id,code)=>{const t=await api('/api/admin/report/'+id,null,A(),true),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=code+'-report.csv';a.click()});
window.nt=go(async()=>{await api('/api/admin/notices',{message:$('#nm').value,send_at:$('#ns').value?new Date($('#ns').value).toISOString():null},A());tab('not')});
window.aud=go(async()=>{const d=await api('/api/admin/audit',{election_id:+$('#ai').value,key:$('#ak').value,reason:$('#ar').value},A());$('#ao').innerHTML=`<h4>Voted (${d.participation.length})</h4><table>${d.participation.map(p=>`<tr><td>${esc(p.member_id)}</td><td>${esc(p.name)}</td><td>${esc(p.voted_at)}</td></tr>`).join('')}</table><h4>Activity</h4><table>${d.log.map(l=>`<tr><td>${esc(l.at)}</td><td>${esc(l.action)}</td><td>${esc(l.actor)}</td></tr>`).join('')}</table>`});
home();
</script></body></html>
